<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Datang</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f172a,#2563eb,#06b6d4,#22c55e);
background-size:400% 400%;
animation:bg 12s infinite ease;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:340px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
box-shadow:0 20px 40px rgba(0,0,0,.35);
color:white;
animation:show .7s;
}

@keyframes show{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
outline:none;
margin-bottom:20px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#38bdf8;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#loading{
display:none;
text-align:center;
margin-top:20px;
}

.loader{
width:40px;
height:40px;
margin:auto;
border:4px solid rgba(255,255,255,.3);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

#home{
display:none;
text-align:center;
}

#user{
font-weight:bold;
color:#7dd3fc;
}
</style>
</head>

<body>

<div class="card" id="login">

<h2>Selamat Datang 👋</h2>

<input id="username" placeholder="Masukkan Username">

<button onclick="masuk()">Masuk</button>

<div id="loading">
<div class="loader"></div>
<p>Memuat...</p>
</div>

</div>

<div class="card" id="home">

<h2>Halo, <span id="user"></span> 🎉</h2>

<p>Selamat datang di website.</p>

</div>

<script>
function masuk(){

let nama=document.getElementById("username").value.trim();

if(nama==""){
alert("Masukkan username.");
return;
}

document.getElementById("loading").style.display="block";

setTimeout(function(){

document.getElementById("login").style.display="none";
document.getElementById("home").style.display="block";

document.getElementById("user").innerText=nama;

},1800);

}
</script>

</body>
</html>
